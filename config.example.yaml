# Copy to config.yaml and enter your local values. See docs/Configuration.md.
# This file also supplies defaults for omitted options. PAGES is replaced as a whole.
# Quote colors and credentials. Use true/false and null (not Python literals).

# Scheduler and behavior
SHOW_PER_CORE: false
REQUEST_TIMEOUT: 5
DISPLAY_BACKLIGHT: 100

# Optional command before power actions (null disables it)
pre_shutdown: null

# Display driver: 2inch or 1inch69; hardware pins remain in lcd/lcdconfig.py
LCD_DEVICE: 2inch
FAST_INTERVAL: 1
MEDIUM_INTERVAL: 60
SLOW_INTERVAL: 600

# Logging
LOG_LEVEL: INFO
LOG_FAST_VALUES: false
LOG_MEDIUM_VALUES: true
LOG_SLOW_VALUES: true
LOG_LOOP_TIMINGS: true
LOG_BUTTON_EVENTS: true

# IPv4 interface preference
NETWORK_INTERFACES:
- eth0
- wlan0

# GPIO buttons (BCM numbering); null disables an individual pin
BUTTONS_ENABLED: false
GPIO_BUTTON_PREVIOUS: 19
GPIO_BUTTON_NEXT: 26
GPIO_BUTTON_OK: 20
GPIO_BUTTON_BACK: 21
BUTTON_PULL_UP: true
BUTTON_BOUNCE_TIME: 0.08

# Module blocks are opt-in and are NEVER inherited as defaults.
# Remove a block to stop loading and polling that module.
system: {}
network: {}
# Replace `network: {}` with the block below to enable WAN/public-IP checks.
# Intervals are symbolic and follow FAST_INTERVAL/MEDIUM_INTERVAL/SLOW_INTERVAL.
# network:
#   wan:
#     enabled: true
#     target: 1.1.1.1
#     interval: medium   # fast, medium or slow
#     timeout: 1.0
#   external_ipv4:
#     enabled: true
#     url: https://api.ipify.org
#     interval: slow     # fast, medium or slow
#     verify_ssl: true
#   checks:
#     router:
#       ip: 192.168.1.1
#       title: Router
#       interval: fast
#       timeout: 1.0
#     dns:
#       ip: 8.8.8.8
#       title: Google DNS
#       interval: medium
#       timeout: 1.0
# storage: {}  # Root filesystem; see docs/Storage.md for multiple disks and SMART
# power: {}  # Enables shutdown/reboot cards

# Optional integrations (uncomment the block and enter your credentials):
# pihole:
#   url: http://pi.hole
#   password: ''
#   verify_ssl: true
# pivccu:
#   ip: 192.168.1.30
#   token: YOUR_CCU_XML_API_TOKEN
# home_assistant:
#   url: http://homeassistant.local:8123
#   token: YOUR_LONG_LIVED_ACCESS_TOKEN
#   verify_ssl: true
#   entities:
#     temperature:
#       entity_id: sensor.living_room_temperature
#       title: Living room
#       precision: 1
#     lamp:
#       entity_id: switch.living_room_lamp
#       state_labels: {'on': 'ON', 'off': 'OFF'}
# adguard: {}  # Requires home_assistant; see docs for entity names
# proxmox:
#   url: https://pve.example.lan:8006
#   api_token_id: dashboard@pve!lcd-dashboard
#   api_token_secret: YOUR_TOKEN_SECRET
#   verify_ssl: true
#   include_lxc: false
#   vms:
#     homeassistant:
#       vmid: 100
#       title: Home Assistant
#     dockerhost: 101
# docker:
#   socket: /var/run/docker.sock
#   containers:
#     homeassistant:
#       name: homeassistant
#       title: Home Assistant
#     mqtt: mosquitto
# rest:
#   endpoints:
#     temperature:
#       url: http://192.168.1.50/api/status
#       interval: 60       # allowed: 1, 60, 600 seconds
#       path: sensors.temperature
#       title: Temperature
#       unit: '°C'
#       precision: 1
#       detail_path: device.name
#       verify_ssl: true
#       headers:
#         Authorization: 'Bearer YOUR_TOKEN'

# Storage example with multiple filesystems and optional SMART.
# `device` is the physical device used by smartctl; `io_device` is the
# psutil/Linux diskstats name. Omit them when automatic mount-source detection is enough.
# storage:
#   smartctl: smartctl
#   devices:
#     root:
#       mount: /
#       title: ROOT
#       smart: false
#     ssd:
#       mount: /mnt/ssd
#       title: SSD
#       device: /dev/sda
#       io_device: sda
#       smart: true

# Grid and selection
GRID_ROWS: 3
GRID_COLS: 3
SHOW_SELECTION_FRAME: true
C_SELECTED: '#0066FF'
SELECTED_BORDER_WIDTH: 4
SELECTED_INSET: 3

# Pages: this entire list is replaced when PAGES is set in config.yaml
PAGES:
- name: overview
  navigation: browse
  layout:
    row1cell1:
      module: cpu
      target_page: system_detail
    row1cell2:
      module: ram
      target_page: system_detail
    row1cell3:
      module: hdd
      target_page: storage_detail
    row2cell1:
      module: temp_ring
      target_page: metrics_detail
    row2cell2:
      module: cpu_ring
      target_page: metrics_detail
    row2cell3:
      module: ram_ring
      target_page: metrics_detail
    row3cell1:
      module: uptime
      selectable: false
    row3cell2:
      module: network
      colspan: 2
      target_page: network_detail
- name: status
  navigation: browse
  layout:
    row1cell1:
      module: load
      target_page: system_detail
    row1cell2:
      module: ip
      target_page: network_detail
    row1cell3:
      module: hostname
      selectable: false
    row2cell1:
      module: cpu_ring
      target_page: metrics_detail
    row2cell2:
      module: ram_ring
      target_page: metrics_detail
    row2cell3:
      module: temp_ring
      target_page: metrics_detail
    row3cell1: swap_ring
    row3cell2:
      module: traffic
      colspan: 2
      target_page: network_detail
- name: system_detail
  navigation: detail
  layout:
    row1cell1: cpu
    row1cell2: ram
    row1cell3: load
    row2cell1: uptime
    row2cell2: cpu_freq
    row2cell3: processes
    row3cell1: swap
    row3cell2: swap_ring
    row3cell3: freq_ring
- name: storage_detail
  navigation: detail
  layout:
    row1cell1:
      module: hdd
      colspan: 3
    row2cell1: disk_free
    row2cell2: swap
    row2cell3: swap_ring
    row3cell1: disk_ring
    row3cell2:
      module: hostname
      colspan: 2
- name: network_detail
  navigation: detail
  layout:
    row1cell1:
      module: network
      colspan: 3
    row2cell1: network_rx
    row2cell2: network_tx
    row2cell3: network_link
    row3cell1: wifi_ring
    row3cell2:
      module: traffic
      colspan: 2
- name: metrics_detail
  navigation: detail
  layout:
    row1cell1: cpu_ring
    row1cell2: ram_ring
    row1cell3: temp_ring
    row2cell1: disk_ring
    row2cell2: swap_ring
    row2cell3: freq_ring
    row3cell1:
      module: traffic
      colspan: 2
    row3cell3: network_link

# Fonts and theme (quote all colors)
FONT_PATH: ./font/JetBrainsMono-Medium.ttf
FONT_TITLE: 15
FONT_VALUE: 24
FONT_DETAIL: 13
C_SCREEN_BG: '#FFFFFF'
C_CELL_BG: '#FFFFFF'
C_GRID: '#000000'
C_BG: '#00129A'
C_T1: '#000000'
C_T2: '#666666'
C_T3: '#666666'
C_OK: '#008000'
C_WARN: '#D08000'
C_ERROR: '#FF0000'

# Ring appearance
RING_TRACK_COLOR: '#D9D9D9'
RING_WIDTH: 6
RING_PADDING: 4
RING_TITLE_AREA: 15
RING_VALUE_FONT: 17
RING_TITLE_FONT: 13
RING_COLOR_LOW: '#008000'
RING_COLOR_MID: '#E6C200'
RING_COLOR_HIGH: '#FF0000'
RING_COLOR_MIDPOINT: 0.6
TEMP_RING_MIN_C: 0
TEMP_RING_MAX_C: 85

# Automatic font sizing
AUTO_FONT_SCALE: true
FONT_REFERENCE_WIDTH: 320
FONT_REFERENCE_HEIGHT: 240
FONT_SCALE_MIN: 0.6
FONT_SCALE_MAX: 1.5
TEXT_HORIZONTAL_PADDING: 5
FONT_MIN_TITLE: 8
FONT_MIN_VALUE: 10
FONT_MIN_DETAIL: 7
FONT_MIN_RING_VALUE: 8
FONT_MIN_RING_TITLE: 7
